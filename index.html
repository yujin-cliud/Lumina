  <!-- Firebase CDN（元のまま） -->
  <!-- Firebase CDN（匿名ログインは使わない） -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    initializeFirestore,  // ← 追加
    collection, addDoc, getDocs, deleteDoc, doc, updateDoc,
    persistentLocalCache, persistentMultipleTabManager,  // ← 任意（ローカルキャッシュ）
    setLogLevel                                             // ← 任意（ログ抑制）
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB4e1nm-ZktpfSMPVW-umIiw6WQmxs0sqg",
    authDomain: "todoku-basho.firebaseapp.com",
    projectId: "todoku-basho",
    storageBucket: "todoku-basho.appspot.com",
    messagingSenderId: "395140717821",
    appId: "1:395140717821:web:b68a7dce7e5b6f3eb7b294"
  };

  const app = initializeApp(firebaseConfig);

  // ▼ Firestore 初期化（長ポーリング固定 + Fetch Streams 無効）
  const db = initializeFirestore(app, {
    // 任意：永続キャッシュ（複数タブ対応）
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }),
    experimentalForceLongPolling: true,
    useFetchStreams: false
  });
  // 任意：Fire* のデバッグログを抑制
  setLogLevel?.("error");

  // 既存コード互換のため window に公開
  window.db = db;
  window.collection = collection;
  window.addDoc = addDoc;
  window.getDocs = getDocs;
  window.deleteDoc = deleteDoc;
  window.doc = doc;
  window.updateDoc = updateDoc;

  const auth = getAuth(app);
  onAuthStateChanged(auth, (user) => {
    window.currentUser = user || null;
    console.log("Auth:", user ? { uid: user.uid, isAnonymous: !!user.isAnonymous } : "signed out");
  });
</script>

<body>
<!-- 編集モーダル -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <input type="text" id="editTitle" placeholder="タイトル" />
    <textarea id="editContent" placeholder="本文" rows="4"></textarea>
    <input type="text" id="editTags" placeholder="タグ（カンマ区切り）" />
    <!-- 画像URL（Cloudinary） -->
    <label for="editImageUrl">画像URL</label>
    <input type="url" id="editImageUrl" placeholder="https://res.cloudinary.com/..." />

    <!-- 画像アップロード（Cloudinary unsigned） -->
    <div class="image-upload-row">
      <input type="file" id="editImageFile" accept="image/*" style="display:none;">
      <button type="button" id="pickImageBtn" class="btn-paper is-ghost">画像を選ぶ</button>
      <small id="uploadHint" class="hint">選択後に自動アップロードされます</small>
    </div>

    <div class="modal-buttons">
      <button id="saveEditBtn" class="btn-paper is-primary">保存</button>
      <button id="cancelEditBtn" class="btn-paper is-ghost">キャンセル</button>
    </div>
  </div>
</div>

<!-- スプラッシュ -->
<div id="splash-screen">
  <img src="image/logo.svg" alt="Lumina" class="splash-logo" />
</div>

<header class="app-header">

    <img src="image/logo.svg" alt="Lumina" class="header-logo" />

    <div class="icon-group">
      <img src="image/icon_post.svg" class="menu-icon" id="iconPost" alt="投稿" />

      <img src="image/icon_favorite.svg" class="menu-icon" id="iconFavorite" alt="お気に入り" />
<!-- これに置き換え -->
<img src="image/login.svg"  class="menu-icon" id="headerLoginBtn"  alt="Googleログイン" />
<img src="image/logout.svg" class="menu-icon is-hidden" id="headerLogoutBtn" alt="ログアウト" />



      <!-- ベルはラッパーで1セルに収め、バッジを重ねる -->
      <div class="icon-bell">
        <img src="image/icon_bell.svg" class="menu-icon" id="iconBell" alt="通知" />

      </div>
    </div>
  </div> <!-- /header-container -->
</header>



<div class="form-wrapper">

    <button id="closeFormBtn" class="modal-close">×</button>

<div id="loginPrompt" class="form-login-prompt">
  投稿するにはログインが必要です。
  <button type="button" id="loginBtn" class="btn-paper is-primary" style="margin-left:8px;">
    Googleでログイン
  </button>
</div>

<!-- ログイン済みだけ表示（初期は隠す） -->
<form id="diary-form" class="is-hidden">
  <!-- 既存の入力欄たち（名前／タイトル／本文／タグ…） -->

    <form id="diary-form">
      <input type="text" id="username" placeholder="お名前（省略可）" />
      <div class="icon-selector">
        <label>アイコンを選択：</label>
        <div class="icon-options">
          <img src="image/avatars/1.png" class="profile-icon" data-icon="image/avatars/1.png" alt="icon1">
          <img src="image/avatars/2.png" class="profile-icon" data-icon="image/avatars/2.png" alt="icon2">

<script type="module" src="script.js"></script>
<!-- 通知設定モーダル -->
<div id="notif-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="notif-title">
  <div class="modal-content">
    <h3 id="notif-title" style="margin:0 0 8px 0;">通知設定</h3>
    <p style="margin:0 0 12px 0; color:#555;">受け取りたい通知を選んでください。</p>

    <div class="notif-grid simple">
  <label class="notif-row" for="notifyCommentOnMyPost" title="自分の投稿にコメントが付いたら通知">
    <input type="checkbox" id="notifyCommentOnMyPost" />
    <span class="notif-text">コメント</span>
  </label>

  <label class="notif-row" for="notifyReplyToMyComment" title="自分のコメントに返信が付いたら通知">
    <input type="checkbox" id="notifyReplyToMyComment" />
    <span class="notif-text">返信</span>
  </label>

  <label class="notif-row" for="notifyMention" title="本文で @メンションされたら通知">
    <input type="checkbox" id="notifyMention" />
    <span class="notif-text">@メンション</span>
  </label>

  <label class="notif-row" for="notifyLikeOnMyPost" title="自分の投稿に『いいね』が付いたら通知">
    <input type="checkbox" id="notifyLikeOnMyPost" />
    <span class="notif-text">いいね</span>
  </label>
</div>


    <div class="modal-buttons">
      <button id="notifSaveBtn" class="btn-paper is-primary">保存</button>
      <button id="notifCancelBtn" class="btn-paper is-ghost">閉じる</button>
    </div>
  </div>
</div>

<!-- コメントモーダル -->

    </div>
    <div id="comment-list" style="margin-top: 15px;"></div>
  </div>
</div>
